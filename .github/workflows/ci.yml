name: Go CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build application
        run: go build -v ./...

      - name: Start isolated MongoDB replica set
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run automated tests with coverage
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Generate HTML coverage
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Enforce at least 70 percent total coverage
        shell: bash
        run: |
          go tool cover -func=coverage.out | awk '/^total:/ { found=1; value=$3; sub(/%$/, "", value); print "Total coverage: " value "%"; if (value+0 < 70) exit 1 } END { if (!found) exit 1 }'

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn

      - name: Stop isolated MongoDB
        if: always()
        run: docker compose -f docker-compose.test.yml down
