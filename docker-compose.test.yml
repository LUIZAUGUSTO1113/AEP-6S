name: aep-tests

services:
  mongodb-test:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27018:27017"
    # Disposable storage, independent of the application's mongo_data volume.
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
