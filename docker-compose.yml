version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: water_monitoring_db
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: water_monitoring_api
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      PORT: ${PORT:-8080}
    depends_on:
      - mongodb

volumes:
  mongo_data:
