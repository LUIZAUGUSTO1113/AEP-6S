basePath: /
definitions:
  internal_sample.CreateSampleRequest:
    properties:
      collected_at:
        example: "2026-09-04T21:00:00Z"
        type: string
      parameter:
        example: pH
        type: string
      river:
        example: Rio Paraná
        type: string
      value:
        example: 7.2
        type: number
    required:
    - parameter
    - river
    - value
    type: object
  internal_sample.Sample:
    properties:
      collected_at:
        type: string
      id:
        type: string
      parameter:
        type: string
      river:
        type: string
      value:
        type: number
    type: object
  internal_sample.UpdateSampleRequest:
    properties:
      collected_at:
        example: "2026-09-06T10:00:00Z"
        type: string
      parameter:
        example: Turbidity
        type: string
      river:
        example: Rio Iguaçu
        type: string
      value:
        example: 15.5
        type: number
    required:
    - parameter
    - river
    - value
    type: object
info:
  contact: {}
  description: This is a sample server for monitoring water quality in rivers.
  title: Water Quality Monitoring API
  version: "1.0"
paths:
  /samples:
    get:
      description: Retrieve all samples from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_sample.Sample'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all samples
      tags:
      - samples
    post:
      consumes:
      - application/json
      description: Create a new sample with the provided data
      parameters:
      - description: Sample data
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/internal_sample.CreateSampleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_sample.Sample'
        "400":
          description: Bad Request (e.g. Invalid JSON, River is required)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new sample
      tags:
      - samples
  /samples/{id}:
    delete:
      description: Delete a sample from the database
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request (e.g. Invalid ObjectID format)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a sample
      tags:
      - samples
    put:
      consumes:
      - application/json
      description: Fully replace an existing sample by ID (idempotent PUT)
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: string
      - description: Full sample replacement data
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/internal_sample.UpdateSampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_sample.Sample'
        "400":
          description: Bad Request (e.g. Invalid JSON, River is required, Parameter
            is required)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a sample
      tags:
      - samples
swagger: "2.0"
