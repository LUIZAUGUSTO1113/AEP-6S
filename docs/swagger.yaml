basePath: /
definitions:
  internal_sample.Sample:
    properties:
      collected_at:
        type: string
      id:
        type: string
      parameter:
        type: string
      river:
        type: string
      value:
        type: number
    type: object
info:
  contact: {}
  description: This is a sample server for monitoring water quality in rivers.
  title: Water Quality Monitoring API
  version: "1.0"
paths:
  /samples:
    get:
      description: Retrieve all samples from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_sample.Sample'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all samples
      tags:
      - samples
    post:
      consumes:
      - application/json
      description: Create a new sample with the provided data
      parameters:
      - description: Sample data
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/internal_sample.Sample'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_sample.Sample'
        "400":
          description: Bad Request (e.g. Invalid JSON, River is required)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new sample
      tags:
      - samples
swagger: "2.0"
