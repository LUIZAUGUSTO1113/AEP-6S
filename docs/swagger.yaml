basePath: /
definitions:
  internal_alert.Alert:
    properties:
      created_at:
        type: string
      id:
        type: string
      message:
        type: string
      parameter:
        type: string
      sample_id:
        type: string
      station_id:
        type: string
      value:
        type: number
    type: object
  internal_sample.Sample:
    properties:
      collected_at:
        type: string
      id:
        type: string
      parameter:
        type: string
      river:
        type: string
      station_id:
        type: string
      value:
        type: number
    type: object
  internal_sample.SampleRequest:
    properties:
      collected_at:
        example: "2026-09-04T21:00:00Z"
        type: string
      parameter:
        example: pH
        type: string
      station_id:
        example: 507f1f77bcf86cd799439011
        type: string
      value:
        example: 7.2
        type: number
    required:
    - parameter
    - station_id
    - value
    type: object
  internal_station.Location:
    properties:
      city:
        type: string
      lat:
        type: number
      lng:
        type: number
      state:
        type: string
    type: object
  internal_station.LocationRequest:
    properties:
      city:
        example: Maringá
        type: string
      lat:
        example: -23.42
        type: number
      lng:
        example: -51.93
        type: number
      state:
        example: PR
        type: string
    required:
    - city
    - state
    type: object
  internal_station.Station:
    properties:
      code:
        type: string
      id:
        type: string
      location:
        $ref: '#/definitions/internal_station.Location'
      name:
        type: string
      river:
        type: string
      thresholds:
        items:
          $ref: '#/definitions/internal_station.Threshold'
        type: array
    type: object
  internal_station.StationRequest:
    properties:
      code:
        example: IVA-001
        type: string
      location:
        $ref: '#/definitions/internal_station.LocationRequest'
      name:
        example: Ponto Ponte do Rio Ivaí
        type: string
      river:
        example: Rio Ivaí
        type: string
      thresholds:
        items:
          $ref: '#/definitions/internal_station.ThresholdRequest'
        type: array
    required:
    - code
    - location
    - name
    - river
    type: object
  internal_station.Threshold:
    properties:
      max:
        type: number
      min:
        type: number
      parameter:
        type: string
    type: object
  internal_station.ThresholdRequest:
    properties:
      max:
        example: 9
        type: number
      min:
        example: 6
        type: number
      parameter:
        example: pH
        type: string
    required:
    - parameter
    type: object
info:
  contact: {}
  description: This is a sample server for monitoring water quality in rivers.
  title: Water Quality Monitoring API
  version: "1.0"
paths:
  /alerts:
    get:
      description: Retrieve alerts generated by samples outside their station thresholds
      parameters:
      - description: Station ID (hexadecimal ObjectID)
        in: query
        name: station_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_alert.Alert'
            type: array
        "400":
          description: Invalid station ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List alerts
      tags:
      - alerts
  /samples:
    get:
      description: Retrieve all samples or only the samples linked to a station
      parameters:
      - description: Station ID (hexadecimal ObjectID)
        in: query
        name: station_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_sample.Sample'
            type: array
        "400":
          description: Invalid station ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List samples
      tags:
      - samples
    post:
      consumes:
      - application/json
      description: Record a measurement at an existing station and generate an alert
        if it violates a threshold
      parameters:
      - description: Sample data
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/internal_sample.SampleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_sample.Sample'
        "400":
          description: Invalid sample data
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Station not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new sample
      tags:
      - samples
  /samples/{id}:
    delete:
      description: Delete a sample and its alert, if any
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid sample ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Sample not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a sample
      tags:
      - samples
    put:
      consumes:
      - application/json
      description: Replace an existing sample and reevaluate its alert
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: string
      - description: Full sample replacement data
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/internal_sample.SampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_sample.Sample'
        "400":
          description: Invalid sample data or ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Sample or station not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a sample
      tags:
      - samples
  /stations:
    get:
      description: Retrieve every monitoring station
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_station.Station'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List stations
      tags:
      - stations
    post:
      consumes:
      - application/json
      description: Create a monitoring station with nested location and thresholds.
        The code must be unique.
      parameters:
      - description: Station data
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/internal_station.StationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_station.Station'
        "400":
          description: Bad Request (e.g. Invalid JSON, Name is required, pH threshold
            out of range)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict (station code already exists)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a station
      tags:
      - stations
  /stations/{id}:
    delete:
      description: Delete a station. Refused with 409 while any sample still references
        it.
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request (invalid ObjectID format)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict (station still has samples)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a station
      tags:
      - stations
    get:
      description: Retrieve one station by ID
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_station.Station'
        "400":
          description: Bad Request (invalid ObjectID format)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a station
      tags:
      - stations
    put:
      consumes:
      - application/json
      description: Replace every editable field of a station (idempotent PUT)
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      - description: Full station replacement data
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/internal_station.StationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_station.Station'
        "400":
          description: Bad Request (e.g. Invalid JSON, invalid ObjectID, validation
            error)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict (station code already exists)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a station
      tags:
      - stations
swagger: "2.0"
